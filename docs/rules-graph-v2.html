ed by an academic document -> FLAG. No academic documents at all -> FLAG. *(approved)*", "status": "approved", "triggers": ["FAIL", "FLAG"], "kind": "rule", "notes": []}, {"id": "ACAD-03", "title": "Equivalency", "section": 4, "sub": "4.8 ACADEMIC CERTIFICATES", "text": "valid tracks SSC + HSC, SSC + Alim, Dakhil + Alim, SSC + Diploma -> PASS. Any other combination -> FLAG. *(approved)*", "status": "approved", "triggers": ["FLAG", "PASS"], "kind": "rule", "notes": []}, {"id": "ACAD-04", "title": "Name/DOB", "section": 4, "sub": "4.8 ACADEMIC CERTIFICATES", "text": "names must match StudentRef; SSC/Dakhil DOB must match the Passport DOB. Mismatch -> FLAG.", "status": "rulebook", "triggers": ["FLAG"], "kind": "rule", "notes": []}, {"id": "ACAD-05", "title": "Notary", "section": 4, "sub": "4.8 ACADEMIC CERTIFICATES", "text": "every academic certificate and transcript must be notarised (Section 0): the notary's red seal AND \"Notary Public\" / \"Advocate\". Missing -> FAIL; can't be confirmed -> FLAG. The e-Apostille page itself needs no notarisation. *(approved)*", "status": "approved", "triggers": ["FAIL", "FLAG"], "kind": "rule", "notes": []}, {"id": "TAX-01", "title": "Presence", "section": 4, "sub": "4.9 INCOME TAX (optional)", "text": "no Income Tax pages -> PASS. TAX-03..04 run only for documents present.", "status": "rulebook", "triggers": ["PASS"], "kind": "rule", "notes": []}, {"id": "TAX-02", "title": "", "section": 4, "sub": "4.9 INCOME TAX (optional)", "text": "removed (2026-11-12). The challan is judged by TAX-04 only.", "status": "rulebook", "triggers": [], "kind": "rule", "notes": []}, {"id": "TAX-03", "title": "Wealth Limit", "section": 4, "sub": "4.9 INCOME TAX (optional)", "text": "if an Acknowledgment is present, Total Income Shown must be >= 5,000,000 BDT. Less -> FLAG.", "status": "rulebook", "triggers": ["FLAG"], "kind": "rule", "notes": []}, {"id": "TAX-04", "title": "Challan Verification", "section": 4, "sub": "4.9 INCOME TAX (optional)", "text": "challan number read from the QR first, else the printed text; printed amount from \"Total Amount\", never the line under \"Amount in words\". Checked online (Section 7): website amount = printed amount -> PASS; mismatch -> FAIL; refunded challan (\"not valid for any service\") -> FAIL; no such challan -> FLAG (a misread number looks the same); internet fails -> FLAG. Bank-counter challans -> FLAG (manual review). QR codes on the Income Tax Certificate and Acknowledgment are ignored.", "status": "rulebook", "triggers": ["FAIL", "FLAG", "PASS"], "kind": "rule", "notes": []}, {"id": "LANG-01", "title": "Expiry", "section": 4, "sub": "4.10 IELTS / TOPIK (optional; absent -> no LANG results, REQ-10 notes it)", "text": "within 2 years of the test date (IELTS) or issue date (TOPIK), inclusive. Expired -> FAIL.", "status": "rulebook", "triggers": ["FAIL"], "kind": "rule", "notes": []}, {"id": "LANG-02", "title": "Name/DOB", "section": 4, "sub": "4.10 IELTS / TOPIK (optional; absent -> no LANG results, REQ-10 notes it)", "text": "must match StudentRef. Mismatch -> FAIL (unless affidavit). StudentRef missing -> FLAG.", "status": "rulebook", "triggers": ["FAIL", "FLAG"], "kind": "rule", "notes": []}, {"id": "DEATH-01", "title": "Assignment", "section": 4, "sub": "4.11 DEATH CERTIFICATE (replaces a parent's NID)", "text": "deceased must match FatherRef or MotherRef. Student or anyone else -> FAIL. Two certificates for the same parent -> FLAG.", "status": "approved", "triggers": ["FAIL", "FLAG"], "kind": "rule", "notes": []}, {"id": "DEATH-02", "title": "Format", "section": 4, "sub": "4.11 DEATH CERTIFICATE (replaces a parent's NID)", "text": "if Bangla, must have an English translation. Missing -> FAIL.", "status": "approved", "triggers": ["FAIL"], "kind": "rule", "notes": []}, {"id": "DEATH-03", "title": "Notary", "section": 4, "sub": "4.11 DEATH CERTIFICATE (replaces a parent's NID)", "text": "must be notarised. Missing -> FAIL.", "status": "approved", "triggers": ["FAIL"], "kind": "rule", "notes": []}, {"id": "DEATH-04", "title": "Date", "section": 4, "sub": "4.11 DEATH CERTIFICATE (replaces a parent's NID)", "text": "date of death readable and not after the current date. Otherwise -> FLAG.", "status": "approved", "triggers": ["FLAG"], "kind": "rule", "notes": []}, {"id": "DEATH-05", "title": "Consistency", "section": 4, "sub": "4.11 DEATH CERTIFICATE (replaces a parent's NID)", "text": "no financial document may present the deceased parent as a living sponsor. Employment Certificate for them issued after the date of death -> FAIL. Any other Employment Certificate, Trade License or TIN in their name -> FLAG.", "status": "approved", "triggers": ["FAIL", "FLAG"], "kind": "rule", "notes": []}, {"id": "CHAIN-01", "title": "", "section": 5, "sub": "5.1 The Financial Chain (TIN and Trade License / Employment Certificate; bank excluded)", "text": "deleted (2026-11-12); it was the same check as TIN-03.", "status": "rulebook", "triggers": [], "kind": "rule", "notes": ["Both a Trade License and an Employment Certificate submitted -> FLAG (reviewer picks which one forms the chain). One link unreadable or duplicated -> FLAG, but a link reliably in the student's name still FAILs."]}, {"id": "CHAIN-02", "title": "", "section": 5, "sub": "5.1 The Financial Chain (TIN and Trade License / Employment Certificate; bank excluded)", "text": "TIN and the income document must belong to the same parent (TIN=Father, Trade=Father -> PASS; TIN=Father, Trade or Employment=Mother -> FAIL). A link that reliably matches no family member -> FAIL.", "status": "rulebook", "triggers": ["FAIL", "PASS"], "kind": "rule", "notes": ["Both a Trade License and an Employment Certificate submitted -> FLAG (reviewer picks which one forms the chain). One link unreadable or duplicated -> FLAG, but a link reliably in the student's name still FAILs."]}, {"id": "CHAIN-03", "title": "", "section": 5, "sub": "5.1 The Financial Chain (TIN and Trade License / Employment Certificate; bank excluded)", "text": "TIN in the StudentRef name -> FAIL. (The income document being the student's is TRADE-04 / EMP-05's job.)", "status": "rulebook", "triggers": ["FAIL"], "kind": "rule", "notes": ["Both a Trade License and an Employment Certificate submitted -> FLAG (reviewer picks which one forms the chain). One link unreadable or duplicated -> FLAG, but a link reliably in the student's name still FAILs."]}, {"id": "AFFIDAVIT", "title": "5.2 Affidavit Coverage", "section": 5, "sub": "5.2 Affidavit Coverage", "text": "On a name mismatch (e.g. a spelling difference) the engine checks the Affidavit.\nAffidavit notarised, explicitly states both spellings are the \"same person\", and matches the student / parent -> PASS.\nNo Affidavit covers the mismatch -> FAIL.", "status": "rulebook", "triggers": ["FAIL", "PASS"], "kind": "rule", "notes": []}, {"id": "apostille.mygov.bd", "title": "e-Apostille register", "section": 7, "sub": null, "text": "the application number from the QR (only from an https link on apostille.mygov.bd) is looked up at `https://apostille.mygov.bd/application-details/<n>`. Confirmed -> VERIFIED (PASS); \"not found\" -> NOT_FOUND (FAIL); anything else -> UNAVAILABLE (FLAG). This proves the apostille exists in the register, not that the scan matches it.", "status": "rulebook", "triggers": ["FAIL", "FLAG", "PASS"], "kind": "api", "notes": []}, {"id": "achallan.gov.bd", "title": "Challan register", "section": 7, "sub": null, "text": "automated challans (`YYYY-NNNNNNNNNN`) are checked at www.achallan.gov.bd, the system challanverification.finance.gov.bd embeds. The owner confirmed (2026-11-11) that real challan numbers may be sent there.", "status": "rulebook", "triggers": [], "kind": "api", "notes": []}, {"id": "IGNORE-01", "title": "", "section": 1, "sub": null, "text": "Any page that matches no signature is silently ignored (IGNORE-01).", "status": "rulebook", "triggers": [], "kind": "rule", "notes": []}, {"id": "ENGINE-COVERAGE", "title": "", "section": 6, "sub": null, "text": "Until every rule is implemented, an `ENGINE-COVERAGE` FLAG names the unchecked rules, so", "status": "rulebook", "triggers": ["FLAG"], "kind": "rule", "notes": []}], "edges": [["AFFIDAVIT", "ACAD-04"], ["AFFIDAVIT", "BANK-01"], ["AFFIDAVIT", "BIRTH-05"], ["AFFIDAVIT", "CHAIN-03"], ["AFFIDAVIT", "DEATH-01"], ["AFFIDAVIT", "EMP-05"], ["AFFIDAVIT", "FRC-02"], ["AFFIDAVIT", "FRC-03"], ["AFFIDAVIT", "LANG-02"], ["AFFIDAVIT", "NID-ASSIGN"], ["AFFIDAVIT", "TIN-03"], ["AFFIDAVIT", "TRADE-04"], ["EMP-05", "CHAIN-02"], ["EMP-05", "CHAIN-03"], ["FatherRef", "BANK-01"], ["FatherRef", "DEATH-01"], ["FatherRef", "EMP-05"], ["FatherRef", "FRC-03"], ["FatherRef", "NID-ASSIGN"], ["FatherRef", "TRADE-04"], ["MotherRef", "BANK-01"], ["MotherRef", "DEATH-01"], ["MotherRef", "EMP-05"], ["MotherRef", "FRC-03"], ["MotherRef", "NID-ASSIGN"], ["MotherRef", "TRADE-04"], ["NID-03", "TIN-02"], ["NID-ASSIGN", "REQ-08"], ["NID-ASSIGN", "REQ-09"], ["StudentRef", "ACAD-04"], ["StudentRef", "BANK-01"], ["StudentRef", "BIRTH-05"], ["StudentRef", "CHAIN-03"], ["StudentRef", "FRC-02"], ["StudentRef", "LANG-02"], ["StudentRef", "NID-ASSIGN"], ["TAX-01", "TAX-03"], ["TAX-01", "TAX-04"], ["TAX-04", "TAX-02"], ["TIN-03", "CHAIN-01"], ["TIN-03", "CHAIN-02"], ["TRADE-04", "CHAIN-02"], ["TRADE-04", "CHAIN-03"], ["achallan.gov.bd", "TAX-04"], ["apostille.mygov.bd", "ACAD-01"]]};
const SECTION_NAMES = {1: "Pass 1 Ingestion", 2: "Pass 2 Identity Anchors", 3: "Section 3 Required Docs",
  4: "Section 4 Document Rules", 5: "Section 5 Cross-Checks", 6: "Section 6 Final Verdict", 7: "Section 7 Online APIs"};
const COLORS = {1: "#8ab4f8", 2: "#f6c26b", 3: "#f28b82", 4: "#81c995", 5: "#c58af9", 6: "#9aa3b2", 7: "#78d9ec"};

document.getElementById("title").textContent = DATA.title;
const nodes = DATA.nodes.map(d => ({...d}));
const byId = new Map(nodes.map(n => [n.id, n]));
const out = new Map(nodes.map(n => [n.id, []])), inn = new Map(nodes.map(n => [n.id, []]));
DATA.edges.forEach(([s, t]) => { out.get(s).push(t); inn.get(t).push(s); });
const links = DATA.edges.map(([s, t]) => ({source: s, target: t}));
const radius = n => 7 + 3.2 * Math.sqrt(out.get(n.id).length);
const label = n => n.id === "AFFIDAVIT" ? "5.2 Affidavit" : n.id;

function walk(start, adj) {
  const seen = new Set(), stack = [start];
  while (stack.length) for (const y of adj.get(stack.pop())) if (y !== start && !seen.has(y)) { seen.add(y); stack.push(y); }
  return seen;
}

// Legend + search list
const legend = document.getElementById("legend");
[...new Set(nodes.map(n => n.section))].sort().forEach(s => {
  legend.insertAdjacentHTML("beforeend", `<div><i style="background:${COLORS[s]}"></i>${SECTION_NAMES[s] || "Section " + s}</div>`);
});
legend.insertAdjacentHTML("beforeend", `<div class="muted" style="margin-top:4px">Size = number of direct dependents</div>`);
document.getElementById("ids").innerHTML = nodes.map(n => `<option value="${n.id}">`).join("");

// Graph
const svg = d3.select("svg");
const defs = svg.append("defs");
[["base", "#4a5160"], ["up", "#f6c26b"], ["down", "#78d9ec"]].forEach(([k, c]) => defs.append("marker")
  .attr("id", "arrow-" + k).attr("viewBox", "0 -4 8 8").attr("refX", 8).attr("markerWidth", 7).attr("markerHeight", 7)
  .attr("orient", "auto").append("path").attr("d", "M0,-4L8,0L0,4").attr("fill", c));
const root = svg.append("g");
const zoom = d3.zoom().scaleExtent([0.2, 4]).on("zoom", e => root.attr("transform", e.transform));
svg.call(zoom).on("click", e => { if (e.target === svg.node()) select(null); });

const link = root.append("g").selectAll("line").data(links).join("line")
  .attr("class", "link").attr("marker-end", "url(#arrow-base)");
const node = root.append("g").selectAll("g").data(nodes).join("g").attr("class", "node")
  .on("click", (e, d) => { e.stopPropagation(); select(d.id); })
  .call(d3.drag()
    .on("start", (e, d) => { if (!e.active) sim.alphaTarget(0.3).restart(); d.fx = d.x; d.fy = d.y; })
    .on("drag", (e, d) => { d.fx = e.x; d.fy = e.y; })
    .on("end", (e, d) => { if (!e.active) sim.alphaTarget(0); d.fx = null; d.fy = null; }));
node.append("circle").attr("r", radius).attr("fill", d => COLORS[d.section]);
node.append("text").attr("x", d => radius(d) + 3).attr("y", 3).text(label);
node.append("title").text(d => d.id + (d.title ? " — " + d.title : ""));

const sections = [...new Set(nodes.map(n => n.section))].sort();
const sim = d3.forceSimulation(nodes)
  .force("link", d3.forceLink(links).id(d => d.id).distance(80))
  .force("charge", d3.forceManyBody().strength(-260))
  .force("collide", d3.forceCollide(d => radius(d) + 14))
  .force("x", d3.forceX(d => (sections.indexOf(d.section) - (sections.length - 1) / 2) * 140).strength(0.06))
  .force("y", d3.forceY(0).strength(0.05))
  .on("tick", () => {
    link.each(function (d) {
      const dx = d.target.x - d.source.x, dy = d.target.y - d.source.y, len = Math.hypot(dx, dy) || 1;
      const r = radius(d.target) + 2;
      d3.select(this).attr("x1", d.source.x).attr("y1", d.source.y)
        .attr("x2", d.target.x - dx / len * r).attr("y2", d.target.y - dy / len * r);
    });
    node.attr("transform", d => `translate(${d.x},${d.y})`);
  });
function fit() {
  const {width, height} = svg.node().getBoundingClientRect();
  svg.call(zoom.transform, d3.zoomIdentity.translate(width / 2, height / 2).scale(Math.min(1, width / 1100)));
}
fit();

// Filters
const needsBox = document.getElementById("needs"), outcomeSel = document.getElementById("outcome");
const visible = n => (!needsBox.checked || n.status === "needs approval") &&
  (outcomeSel.value === "all" || n.triggers.includes(outcomeSel.value));
function applyFilters() {
  node.classed("hidden", d => !visible(d));
  link.classed("hidden", d => !visible(d.source) || !visible(d.target));
  document.getElementById("count").textContent = `${nodes.filter(visible).length} of ${nodes.length} nodes`;
}
needsBox.onchange = outcomeSel.onchange = applyFilters;
applyFilters();

// Selection
function select(id) {
  if (!id) {
    node.classed("sel up down dim", false); link.classed("up down dim", false).attr("marker-end", "url(#arrow-base)");
    return;
  }
  const up = walk(id, inn), down = walk(id, out);
  const upSet = new Set([...up, id]), downSet = new Set([...down, id]);
  node.classed("sel", d => d.id === id).classed("up", d => up.has(d.id)).classed("down", d => down.has(d.id))
    .classed("dim", d => d.id !== id && !up.has(d.id) && !down.has(d.id));
  link.classed("up", d => upSet.has(d.source.id) && upSet.has(d.target.id))
    .classed("down", d => downSet.has(d.source.id) && downSet.has(d.target.id))
    .classed("dim", d => !(upSet.has(d.source.id) && upSet.has(d.target.id)) && !(downSet.has(d.source.id) && downSet.has(d.target.id)))
    .attr("marker-end", d => upSet.has(d.source.id) && upSet.has(d.target.id) ? "url(#arrow-up)"
      : downSet.has(d.source.id) && downSet.has(d.target.id) ? "url(#arrow-down)" : "url(#arrow-base)");
  showPanel(byId.get(id), up, down);
}

const esc = s => s.replace(/[&<>"]/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[c]));
const idPattern = new RegExp("\\b(" + nodes.map(n => n.id.replace(/[.]/g, "\\.")).sort((a, b) => b.length - a.length).join("|") + ")\\b", "g");
const rich = s => esc(s).replace(idPattern, m => `<a class="rid" data-id="${m}">${m}</a>`)
  .replace(/(?<!never )\b(PASS|FLAG|FAIL)(e?s)?\b/g, (m, o) => `<b class="o-${o}">${m}</b>`);
const depList = ids => ids.size ? `<ul class="deps">${[...ids].sort().map(i =>
  `<li><a class="rid" data-id="${i}">${esc(label(byId.get(i)))}</a> <span class="muted">${esc(byId.get(i).title)}</span></li>`).join("")}</ul>`
  : `<p class="muted">None</p>`;

function showPanel(n, up, down) {
  const statusChip = n.status === "needs approval" ? `<span class="chip needs">needs approval</span>`
    : n.status === "approved" ? `<span class="chip PASS">approved</span>` : `<span class="chip">rulebook text</span>`;
  document.getElementById("panel").innerHTML = `
    <h2>${esc(label(n))}</h2>
    <div class="muted">${esc(n.title || "")}</div>
    <div class="chips">
      <span class="chip" style="color:${COLORS[n.section]};border-color:${COLORS[n.section]}">${esc(SECTION_NAMES[n.section] || "")}</span>
      ${statusChip}
    </div>
    ${n.sub ? `<div class="muted" style="margin-top:8px">${esc(n.sub)}</div>` : ""}
    <h3>Outcomes</h3>
    <div class="chips">${n.triggers.length ? n.triggers.map(t => `<span class="chip ${t}">${t}</span>`).join("")
      : `<span class="muted">No outcome stated</span>`}</div>
    <h3>Rule text</h3>
    <div class="text">${n.text.split("\n").map(p => `<p>${rich(p)}</p>`).join("")}</div>
    ${n.notes.length ? `<h3>Notes for ${esc(n.sub.split(" ")[0])}</h3><div class="text">${n.notes.map(p => `<p>${rich(p)}</p>`).join("")}</div>` : ""}
    <h3>Upstream (${up.size}) — feeds this rule</h3>${depList(up)}
    <h3>Downstream (${down.size}) — depends on it</h3>${depList(down)}`;
}
document.getElementById("panel").addEventListener("click", e => {
  const a = e.target.closest("a.rid"); if (a) jump(a.dataset.id);
});

function jump(id) {
  const n = byId.get(id); if (!n) return;
  select(id);
  const {width, height} = svg.node().getBoundingClientRect();
  svg.transition().duration(500).call(zoom.transform, d3.zoomIdentity.translate(width / 2, height / 2).scale(1.4).translate(-n.x, -n.y));
}
const search = document.getElementById("search");
search.addEventListener("change", () => {
  const q = search.value.trim().toLowerCase();
  const n = nodes.find(n => n.id.toLowerCase() === q) || nodes.find(n => n.id.toLowerCase().startsWith(q) || label(n).toLowerCase().includes(q));
  if (n) { jump(n.id); search.value = n.id; }
});
</script>
</body>
</html>
