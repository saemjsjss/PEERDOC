ith certainty -> FLAG. A document whose name reliably mismatches the parent never softens the FAIL.", "status": "rulebook", "triggers": ["FAIL", "FLAG"], "kind": "rule", "notes": []}, {"id": "REQ-10", "title": "", "section": 3, "sub": null, "text": "IELTS/TOPIK and the Student NID are optional: missing -> PASS. Income Tax is optional too (TAX-01).", "status": "rulebook", "triggers": ["PASS"], "kind": "rule", "notes": []}, {"id": "PASSPORT-01", "title": "Expiry", "section": 4, "sub": "4.1 PASSPORT", "text": "the MRZ expiry (check-digit verified) must be at least 12 months after the check date; earlier, or already past -> FAIL. MRZ and printed page disagree -> FLAG: the names do not match (Section 0, with MRZ digits read as in 2.1), or a reliable printed expiry differs from the MRZ expiry. *(approved)*", "status": "approved", "triggers": ["FAIL", "FLAG"], "kind": "rule", "notes": []}, {"id": "NID-01", "title": "Translation", "section": 4, "sub": "4.2 NID (assigned to the father, mother or student, and also an NID that could not be assigned)", "text": "must have an English translation page, even when the card shows English. Missing -> FAIL.", "status": "rulebook", "triggers": ["FAIL"], "kind": "rule", "notes": []}, {"id": "NID-02", "title": "Notary", "section": 4, "sub": "4.2 NID (assigned to the father, mother or student, and also an NID that could not be assigned)", "text": "must be notarised (Section 0).", "status": "rulebook", "triggers": [], "kind": "rule", "notes": []}, {"id": "NID-03", "title": "Number Match", "section": 4, "sub": "4.2 NID (assigned to the father, mother or student, and also an NID that could not be assigned)", "text": "card number vs translation number. Equal -> PASS; 1-2 digits differ -> FLAG; 3 or more -> FAIL. Same length: count the differing positions; a dropped or added digit: edit distance. A low-confidence number is confirmed as in Section 0. *(approved)*", "status": "approved", "triggers": ["FAIL", "FLAG", "PASS"], "kind": "rule", "notes": []}, {"id": "BIRTH-01", "title": "Translation", "section": 4, "sub": "4.3 BIRTH CERTIFICATE (the student's only)", "text": "needs an English translation (Section 0). A bilingual certificate (Bangla and English on one page, e.g. BDRIS) needs no translation page when its English side gives the child's name, date of birth, father's name and mother's name; any of them not reliable -> FLAG. *(approved)*", "status": "approved", "triggers": ["FLAG"], "kind": "rule", "notes": []}, {"id": "BIRTH-02", "title": "Notary", "section": 4, "sub": "4.3 BIRTH CERTIFICATE (the student's only)", "text": "must be notarised (Section 0).", "status": "rulebook", "triggers": [], "kind": "rule", "notes": []}, {"id": "BIRTH-03", "title": "DOB", "section": 4, "sub": "4.3 BIRTH CERTIFICATE (the student's only)", "text": "compared with the Passport date of birth. A Bangla certificate with an English translation: the year only. An English certificate (old BDR Form-3, bilingual BDRIS): the full date. A different year FAILs even when the dates are days apart (31-12-2001 vs 01-01-2002). A low-confidence date PASSes only if it equals the passport date exactly; otherwise -> FLAG.", "status": "rulebook", "triggers": ["FAIL", "FLAG", "PASS"], "kind": "rule", "notes": []}, {"id": "BIRTH-04", "title": "BRN", "section": 4, "sub": "4.3 BIRTH CERTIFICATE (the student's only)", "text": "the Birth Registration Number must start with the birth year. Mismatch (e.g. the old 13- or 16-digit format) -> FLAG, never FAIL.", "status": "rulebook", "triggers": ["FLAG"], "kind": "rule", "notes": []}, {"id": "BIRTH-05", "title": "Name", "section": 4, "sub": "4.3 BIRTH CERTIFICATE (the student's only)", "text": "the name must match StudentRef. Mismatch -> FAIL (this catches a parent's birth certificate).", "status": "rulebook", "triggers": ["FAIL"], "kind": "rule", "notes": []}, {"id": "FRC-01", "title": "Issuer", "section": 4, "sub": "4.4 FAMILY RELATIONSHIP CERTIFICATE (FRC)", "text": "the issuer must be a Union Pari e": "Translation", "section": 4, "sub": "4.6 TRADE LICENSE", "text": "needs an English translation (Section 0).", "status": "rulebook", "triggers": [], "kind": "rule", "notes": []}, {"id": "TRADE-02", "title": "Notary", "section": 4, "sub": "4.6 TRADE LICENSE", "text": "must be notarised (Section 0).", "status": "rulebook", "triggers": [], "kind": "rule", "notes": []}, {"id": "TRADE-03", "title": "Validity", "section": 4, "sub": "4.6 TRADE LICENSE", "text": "the fiscal year runs 1 July - 30 June. The licence PASSes if, on the check date, it is valid until at least the 30 June that ends the current fiscal year (from a \"Valid up to\" date, or the fiscal year printed: 2026-2027 = valid until 30-06-2027), OR it was issued on or after the 1 July that started that fiscal year. Checked in January 2027: valid until 30-06-2027, or issued since 01-07-2026. Neither -> FAIL, also when no such date is found. A date that would pass but is unreliable -> FLAG. A renewal page listing several years counts the latest. *(approved)*", "status": "approved", "triggers": ["FAIL", "FLAG", "PASS"], "kind": "rule", "notes": []}, {"id": "TRADE-04", "title": "Owner", "section": 4, "sub": "4.6 TRADE LICENSE", "text": "the owner is assigned by name (Section 0) to the father or mother.", "status": "rulebook", "triggers": [], "kind": "rule", "notes": []}, {"id": "EMP-01", "title": "Translation", "section": 4, "sub": "4.6b EMPLOYMENT CERTIFICATE (instead of a Trade License)", "text": "needs an English translation (Section 0).", "status": "approved", "triggers": [], "kind": "rule", "notes": []}, {"id": "EMP-02", "title": "Notary", "section": 4, "sub": "4.6b EMPLOYMENT CERTIFICATE (instead of a Trade License)", "text": "must be notarised (Section 0).", "status": "approved", "triggers": [], "kind": "rule", "notes": []}, {"id": "EMP-03", "title": "Date", "section": 4, "sub": "4.6b EMPLOYMENT CERTIFICATE (instead of a Trade License)", "text": "the issue date must be within 3 months. Older -> FAIL.", "status": "approved", "triggers": ["FAIL"], "kind": "rule", "notes": []}, {"id": "EMP-04", "title": "Current", "section": 4, "sub": "4.6b EMPLOYMENT CERTIFICATE (instead of a Trade License)", "text": "must state that the person is employed now. An experience or release letter -> FAIL.", "status": "approved", "triggers": ["FAIL"], "kind": "rule", "notes": []}, {"id": "EMP-05", "title": "Employee", "section": 4, "sub": "4.6b EMPLOYMENT CERTIFICATE (instead of a Trade License)", "text": "the employee is assigned by name (Section 0) to the father or mother. The student's own CV letter never reaches this rule (2.3).", "status": "approved", "triggers": [], "kind": "rule", "notes": []}, {"id": "TIN-01", "title": "QR", "section": 4, "sub": "4.7 TIN CERTIFICATE", "text": "the QR must decode. It doesn't -> FLAG.", "status": "rulebook", "triggers": ["FLAG"], "kind": "rule", "notes": []}, {"id": "TIN-02", "title": "Number Match", "section": 4, "sub": "4.7 TIN CERTIFICATE", "text": "the printed TIN vs the QR TIN (the QR value is exact). 1-2 digits differ -> FLAG; 3 or more -> FAIL. Counted as in NID-03.", "status": "rulebook", "triggers": ["FAIL", "FLAG"], "kind": "rule", "notes": []}, {"id": "TIN-03", "title": "Taxpayer", "section": 4, "sub": "4.7 TIN CERTIFICATE", "text": "the taxpayer is assigned by name (Section 0) to the father or mother. *(approved)*", "status": "approved", "triggers": [], "kind": "rule", "notes": []}, {"id": "ACAD-01", "title": "e-Apostille", "section": 4, "sub": "4.8 ACADEMIC CERTIFICATES (SSC / HSC: secondary / higher secondary school certificates;", "text": "the apostille is looked up in the official register (Section 7) and the register's own copy must be the student's. *(approved)* * Number: from the QR; when the QR can't be decoded, from the \"8. Nº\" line printed on the page. A QR that links to another site or uses http -> FAIL. Neither read -> FLAG. QR number and a reliable printed No. that differ: the QR's number is looked up as usual; a FAIL from the register or owner check stands, any other result -> FLAG. * Register: says not found -> FAIL (FLAG when only the printed No. was looked up: a misread number looks the same). The internet fails -> FLAG. * Owner: the register's copy of the document is read like a submitted one. It must hold the kind (certificate or transcript) and level of the document that follows the apostille, and be in the student's name (StudentRef, Section 0). A register copy in another name, of another level, or with a different reliable board registration number than the document -> FAIL. A register copy that could not be downloaded or read, or a name that is not reliable -> FLAG; a copy read only in part never gives the \"other level\" FAIL (the missing page may be the one). All match -> PASS.", "status": "approved", "triggers": ["FAIL", "FLAG", "PASS"], "kind": "rule", "notes": []}, {"id": "ACAD-02", "title": "Mandatory Pairs", "section": 4, "sub": "4.8 ACADEMIC CERTIFICATES (SSC / HSC: secondary / higher secondary school certificates;", "text": "every level needs both its certificate and its transcript. One missing -> FAIL, but FLAG while a document whose level is not reliable might be the missing one. An apostille not followed by an academic document -> FLAG. No academic documents at all -> FLAG. *(approved)*", "status": "approved", "triggers": ["FAIL", "FLAG"], "kind": "rule", "notes": []}, {"id": "ACAD-03", "title": "Equivalency", "section": 4, "sub": "4.8 ACADEMIC CERTIFICATES (SSC / HSC: secondary / higher secondary school certificates;", "text": "SSC + HSC, SSC + Alim, Dakhil + Alim or SSC + Diploma -> PASS. Any other combination -> FLAG. *(approved)*", "status": "approved", "triggers": ["FLAG", "PASS"], "kind": "rule", "notes": []}, {"id": "ACAD-04", "title": "Name/DOB", "section": 4, "sub": "4.8 ACADEMIC CERTIFICATES (SSC / HSC: secondary / higher secondary school certificates;", "text": "the names must match StudentRef, and the SSC/Dakhil date of birth the Passport's. Mismatch -> FLAG.", "status": "rulebook", "triggers": ["FLAG"], "kind": "rule", "notes": []}, {"id": "ACAD-05", "title": "Notary", "section": 4, "sub": "4.8 ACADEMIC CERTIFICATES (SSC / HSC: secondary / higher secondary school certificates;", "text": "every academic certificate and transcript must be notarised (Section 0). The e-Apostille page itself needs no notarisation. *(approved)*", "status": "approved", "triggers": [], "kind": "rule", "notes": []}, {"id": "ACAD-06", "title": "Registration", "section": 4, "sub": "4.8 ACADEMIC CERTIFICATES (SSC / HSC: secondary / higher secondary school certificates;", "text": "the SSC and HSC carry the same board registration number; only the session after \"/\" differs (1910534278/2020-21 and 1910534278/2022-23). Two reliable numbers that differ -> FLAG. A number that is unreliable or not found is not checked (Section 0). Runs only when both an SSC and an HSC document are present. *(approved)*", "status": "approved", "triggers": ["FLAG"], "kind": "rule", "notes": []}, {"id": "TAX-01", "title": "Presence", "section": 4, "sub": "4.9 INCOME TAX (optional)", "text": "no Income Tax pages -> PASS. TAX-03 and TAX-04 run only for the documents present.", "status": "rulebook", "triggers": ["PASS"], "kind": "rule", "notes": []}, {"id": "TAX-02", "title": "", "section": 4, "sub": "4.9 INCOME TAX (optional)", "text": "deleted (2026-11-12); the challan is judged by TAX-04 only.", "status": "rulebook", "triggers": [], "kind": "rule", "notes": []}, {"id": "TAX-03", "title": "Income Shown", "section": 4, "sub": "4.9 INCOME TAX (optional)", "text": "when an Acknowledgment is present, its Total Income Shown must be at least 5,000,000 BDT. Less -> FLAG.", "status": "rulebook", "triggers": ["FLAG"], "kind": "rule", "notes": []}, {"id": "TAX-04", "title": "Challan Verification", "section": 4, "sub": "4.9 INCOME TAX (optional)", "text": "the challan number comes from the QR, else the printed text; the amount from \"Total Amount\". It is checked online (Section 7): the website amount equals the printed amount -> PASS; they differ -> FAIL; a refunded challan (\"not valid for any service\") -> FAIL; no such challan -> FLAG (a misread number looks the same); the internet fails -> FLAG. A bank-counter challan (paid at a bank, without an automated `YYYY-NNNNNNNNNN` number) -> FLAG. QR codes on the Income Tax Certificate and Acknowledgment are ignored.", "status": "rulebook", "triggers": ["FAIL", "FLAG", "PASS"], "kind": "rule", "notes": []}, {"id": "LANG-01", "title": "Expiry", "section": 4, "sub": "4.10 IELTS / TOPIK (optional; absent -> no LANG results)", "text": "the test date (IELTS) or issue date (TOPIK) must be within 24 months. Older -> FAIL.", "status": "rulebook", "triggers": ["FAIL"], "kind": "rule", "notes": []}, {"id": "LANG-02", "title": "Name/DOB", "section": 4, "sub": "4.10 IELTS / TOPIK (optional; absent -> no LANG results)", "text": "must match StudentRef and the Passport date of birth. Mismatch -> FAIL (5.2 applies). StudentRef missing -> FLAG.", "status": "rulebook", "triggers": ["FAIL", "FLAG"], "kind": "rule", "notes": []}, {"id": "DEATH-01", "title": "Assignment", "section": 4, "sub": "4.11 DEATH CERTIFICATE (replaces a parent's NID)", "text": "the deceased is assigned by name (Section 0) to the father or mother.", "status": "approved", "triggers": [], "kind": "rule", "notes": []}, {"id": "DEATH-02", "title": "Translation", "section": 4, "sub": "4.11 DEATH CERTIFICATE (replaces a parent's NID)", "text": "needs an English translation (Section 0).", "status": "approved", "triggers": [], "kind": "rule", "notes": []}, {"id": "DEATH-03", "title": "Notary", "section": 4, "sub": "4.11 DEATH CERTIFICATE (replaces a parent's NID)", "text": "must be notarised (Section 0).", "status": "approved", "triggers": [], "kind": "rule", "notes": []}, {"id": "DEATH-04", "title": "Date", "section": 4, "sub": "4.11 DEATH CERTIFICATE (replaces a parent's NID)", "text": "the date of death must be reliable and not after the check date. Otherwise -> FLAG.", "status": "approved", "triggers": ["FLAG"], "kind": "rule", "notes": []}, {"id": "DEATH-05", "title": "Consistency", "section": 4, "sub": "4.11 DEATH CERTIFICATE (replaces a parent's NID)", "text": "no financial document may present the deceased parent as a living sponsor. An Employment Certificate for them issued after the date of death -> FAIL. Any other Employment Certificate, Trade License or TIN in their name -> FLAG.", "status": "approved", "triggers": ["FAIL", "FLAG"], "kind": "rule", "notes": []}, {"id": "STAMP-01", "title": "Date", "section": 4, "sub": "4.12 NOTARY AND TRANSLATION DATES", "text": "on every document, each notary date (on or beside the notary's stamp: \"09 JUN 2026\", \"Date: 23/06/2026\") and each translator date (beside \"Translated by\") must be within 3 months. Older -> FAIL. A date read below 0.85 confidence -> FLAG. Translation and notarisation may be on different days. Document dates printed near the notary block (publication date, issue date, a birth date in a table) are not notary dates.", "status": "approved", "triggers": ["FAIL", "FLAG"], "kind": "rule", "notes": []}, {"id": "CHAIN-01", "title": "", "section": 5, "sub": "5.1 The Financial Chain", "text": "deleted (2026-11-12); it repeated TIN-03.", "status": "rulebook", "triggers": [], "kind": "rule", "notes": []}, {"id": "CHAIN-02", "title": "Same Parent", "section": 5, "sub": "5.1 The Financial Chain", "text": "the TIN Certificate, the income document (Trade License or Employment Certificate) and every Bank Solvency must belong to the same parent. Only documents assigned to a parent by their own rule (TIN-03, TRADE-04, EMP-05, BANK-01) are compared; when one of the three has none, CHAIN-02 gives no result (the document's own rule, or REQ-05 / REQ-06 / REQ-07, reports it). One parent has both a TIN and an income document and every compared account holder is that parent -> PASS; an account holder is the other parent -> FAIL. No parent has both (TIN = father, income = mother) -> FAIL. Both parents have both: every compared account holder the same parent -> PASS, otherwise -> FLAG (the reviewer picks). *(approved)*", "status": "approved", "triggers": ["FAIL", "FLAG", "PASS"], "kind": "rule", "notes": []}, {"id": "CHAIN-03", "title": "", "section": 5, "sub": "5.1 The Financial Chain", "text": "merged into TIN-03 (version 9).", "status": "rulebook", "triggers": [], "kind": "rule", "notes": []}, {"id": "CHAIN-04", "title": "", "section": 5, "sub": "5.1 The Financial Chain", "text": "merged into BANK-01 and CHAIN-02 (version 9).", "status": "rulebook", "triggers": [], "kind": "rule", "notes": []}, {"id": "AFFIDAVIT", "title": "5.2 Affidavit Coverage", "section": 5, "sub": "5.2 Affidavit Coverage", "text": "On a name mismatch (e.g. a spelling difference) the engine looks for an Affidavit.\nThe Affidavit is notarised (Section 0), states that both spellings are the \"same person\", and matches the student or parent -> the names match.\nNo Affidavit covers the mismatch -> the rule's own mismatch outcome stands (FAIL, or FLAG where the rule says FLAG, as ACAD-04).", "status": "rulebook", "triggers": ["FAIL", "FLAG"], "kind": "rule", "notes": []}, {"id": "ENGINE-COVERAGE", "title": "", "section": 6, "sub": null, "text": "a rule listed here but not implemented is named in a FLAG, so no case can PASS by accident.", "status": "rulebook", "triggers": ["FLAG", "PASS"], "kind": "rule", "notes": []}, {"id": "apostille.mygov.bd", "title": "e-Apostille register", "section": 7, "sub": null, "text": "the application number (from an https QR link on apostille.mygov.bd, or the printed No.) is looked up at `https://apostille.mygov.bd/application-details/<n>`. For a confirmed number, the register's details are fetched from `https://api.apostille.mygov.bd/api/v1/application-details/<n>` (the lookup behind mofa-servicedirectory.apostille.mygov.bd): the apostille date, the titles of the apostilled documents and their page images. The images are downloaded at once (their links expire), read by OCR and not stored.", "status": "rulebook", "triggers": [], "kind": "api", "notes": []}, {"id": "achallan.gov.bd", "title": "Challan register", "section": 7, "sub": null, "text": "automated challans (`YYYY-NNNNNNNNNN`) are checked at www.achallan.gov.bd, the system that challanverification.finance.gov.bd embeds; the answer gives TAX-04's outcome. The owner confirmed (2026-11-11) that real challan numbers may be sent there.", "status": "rulebook", "triggers": [], "kind": "api", "notes": []}], "edges": [["ACAD-04", "AFFIDAVIT"], ["AFFIDAVIT", "ACAD-01"], ["AFFIDAVIT", "ACAD-04"], ["AFFIDAVIT", "BIRTH-05"], ["AFFIDAVIT", "FRC-02"], ["AFFIDAVIT", "FRC-03"], ["AFFIDAVIT", "LANG-02"], ["AFFIDAVIT", "TIN-03"], ["BANK-01", "CHAIN-02"], ["BANK-01", "CHAIN-04"], ["CHAIN-02", "CHAIN-04"], ["DEATH-01", "FRC-03"], ["DEATH-01", "REQ-09"], ["EMP-05", "CHAIN-02"], ["EMP-05", "CHAIN-04"], ["FatherRef", "FRC-03"], ["MotherRef", "FRC-03"], ["NID-03", "TIN-02"], ["NID-ASSIGN", "REQ-08"], ["NID-ASSIGN", "REQ-09"], ["REQ-05", "CHAIN-02"], ["REQ-06", "CHAIN-02"], ["REQ-07", "CHAIN-02"], ["StudentRef", "ACAD-01"], ["StudentRef", "ACAD-04"], ["StudentRef", "BIRTH-05"], ["StudentRef", "FRC-02"], ["StudentRef", "LANG-02"], ["TAX-01", "REQ-10"], ["TAX-01", "TAX-03"], ["TAX-01", "TAX-04"], ["TAX-04", "TAX-02"], ["TAX-04", "achallan.gov.bd"], ["TIN-03", "CHAIN-01"], ["TIN-03", "CHAIN-02"], ["TIN-03", "CHAIN-03"], ["TRADE-04", "CHAIN-02"], ["TRADE-04", "CHAIN-04"], ["achallan.gov.bd", "TAX-04"], ["apostille.mygov.bd", "ACAD-01"]]};
const SECTION_NAMES = {1: "Pass 1 Ingestion", 2: "Pass 2 Identity Anchors", 3: "Section 3 Required Docs",
  4: "Section 4 Document Rules", 5: "Section 5 Cross-Checks", 6: "Section 6 Final Verdict", 7: "Section 7 Online APIs"};
const COLORS = {1: "#8ab4f8", 2: "#f6c26b", 3: "#f28b82", 4: "#81c995", 5: "#c58af9", 6: "#9aa3b2", 7: "#78d9ec"};

document.getElementById("title").textContent = DATA.title;
const nodes = DATA.nodes.map(d => ({...d}));
const byId = new Map(nodes.map(n => [n.id, n]));
const out = new Map(nodes.map(n => [n.id, []])), inn = new Map(nodes.map(n => [n.id, []]));
DATA.edges.forEach(([s, t]) => { out.get(s).push(t); inn.get(t).push(s); });
const links = DATA.edges.map(([s, t]) => ({source: s, target: t}));
const radius = n => 7 + 3.2 * Math.sqrt(out.get(n.id).length);
const label = n => n.id === "AFFIDAVIT" ? "5.2 Affidavit" : n.id;

function walk(start, adj) {
  const seen = new Set(), stack = [start];
  while (stack.length) for (const y of adj.get(stack.pop())) if (y !== start && !seen.has(y)) { seen.add(y); stack.push(y); }
  return seen;
}

// Legend + search list
const legend = document.getElementById("legend");
[...new Set(nodes.map(n => n.section))].sort().forEach(s => {
  legend.insertAdjacentHTML("beforeend", `<div><i style="background:${COLORS[s]}"></i>${SECTION_NAMES[s] || "Section " + s}</div>`);
});
legend.insertAdjacentHTML("beforeend", `<div class="muted" style="margin-top:4px">Size = number of direct dependents</div>`);
document.getElementById("ids").innerHTML = nodes.map(n => `<option value="${n.id}">`).join("");

// Graph
const svg = d3.select("svg");
const defs = svg.append("defs");
[["base", "#4a5160"], ["up", "#f6c26b"], ["down", "#78d9ec"]].forEach(([k, c]) => defs.append("marker")
  .attr("id", "arrow-" + k).attr("viewBox", "0 -4 8 8").attr("refX", 8).attr("markerWidth", 7).attr("markerHeight", 7)
  .attr("orient", "auto").append("path").attr("d", "M0,-4L8,0L0,4").attr("fill", c));
const root = svg.append("g");
const zoom = d3.zoom().scaleExtent([0.2, 4]).on("zoom", e => root.attr("transform", e.transform));
svg.call(zoom).on("click", e => { if (e.target === svg.node()) select(null); });

const link = root.append("g").selectAll("line").data(links).join("line")
  .attr("class", "link").attr("marker-end", "url(#arrow-base)");
const node = root.append("g").selectAll("g").data(nodes).join("g").attr("class", "node")
  .on("click", (e, d) => { e.stopPropagation(); select(d.id); })
  .call(d3.drag()
    .on("start", (e, d) => { if (!e.active) sim.alphaTarget(0.3).restart(); d.fx = d.x; d.fy = d.y; })
    .on("drag", (e, d) => { d.fx = e.x; d.fy = e.y; })
    .on("end", (e, d) => { if (!e.active) sim.alphaTarget(0); d.fx = null; d.fy = null; }));
node.append("circle").attr("r", radius).attr("fill", d => COLORS[d.section]);
node.append("text").attr("x", d => radius(d) + 3).attr("y", 3).text(label);
node.append("title").text(d => d.id + (d.title ? " — " + d.title : ""));

const sections = [...new Set(nodes.map(n => n.section))].sort();
const sim = d3.forceSimulation(nodes)
  .force("link", d3.forceLink(links).id(d => d.id).distance(80))
  .force("charge", d3.forceManyBody().strength(-260))
  .force("collide", d3.forceCollide(d => radius(d) + 14))
  .force("x", d3.forceX(d => (sections.indexOf(d.section) - (sections.length - 1) / 2) * 140).strength(0.06))
  .force("y", d3.forceY(0).strength(0.05))
  .on("tick", () => {
    link.each(function (d) {
      const dx = d.target.x - d.source.x, dy = d.target.y - d.source.y, len = Math.hypot(dx, dy) || 1;
      const r = radius(d.target) + 2;
      d3.select(this).attr("x1", d.source.x).attr("y1", d.source.y)
        .attr("x2", d.target.x - dx / len * r).attr("y2", d.target.y - dy / len * r);
    });
    node.attr("transform", d => `translate(${d.x},${d.y})`);
  });
function fit() {
  const {width, height} = svg.node().getBoundingClientRect();
  svg.call(zoom.transform, d3.zoomIdentity.translate(width / 2, height / 2).scale(Math.min(1, width / 1100)));
}
fit();

// Filters
const needsBox = document.getElementById("needs"), outcomeSel = document.getElementById("outcome");
const visible = n => (!needsBox.checked || n.status === "needs approval") &&
  (outcomeSel.value === "all" || n.triggers.includes(outcomeSel.value));
function applyFilters() {
  node.classed("hidden", d => !visible(d));
  link.classed("hidden", d => !visible(d.source) || !visible(d.target));
  document.getElementById("count").textContent = `${nodes.filter(visible).length} of ${nodes.length} nodes`;
}
needsBox.onchange = outcomeSel.onchange = applyFilters;
applyFilters();

// Selection
function select(id) {
  if (!id) {
    node.classed("sel up down dim", false); link.classed("up down dim", false).attr("marker-end", "url(#arrow-base)");
    return;
  }
  const up = walk(id, inn), down = walk(id, out);
  const upSet = new Set([...up, id]), downSet = new Set([...down, id]);
  node.classed("sel", d => d.id === id).classed("up", d => up.has(d.id)).classed("down", d => down.has(d.id))
    .classed("dim", d => d.id !== id && !up.has(d.id) && !down.has(d.id));
  link.classed("up", d => upSet.has(d.source.id) && upSet.has(d.target.id))
    .classed("down", d => downSet.has(d.source.id) && downSet.has(d.target.id))
    .classed("dim", d => !(upSet.has(d.source.id) && upSet.has(d.target.id)) && !(downSet.has(d.source.id) && downSet.has(d.target.id)))
    .attr("marker-end", d => upSet.has(d.source.id) && upSet.has(d.target.id) ? "url(#arrow-up)"
      : downSet.has(d.source.id) && downSet.has(d.target.id) ? "url(#arrow-down)" : "url(#arrow-base)");
  showPanel(byId.get(id), up, down);
}

const esc = s => s.replace(/[&<>"]/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[c]));
const idPattern = new RegExp("\\b(" + nodes.map(n => n.id.replace(/[.]/g, "\\.")).sort((a, b) => b.length - a.length).join("|") + ")\\b", "g");
const rich = s => esc(s).replace(idPattern, m => `<a class="rid" data-id="${m}">${m}</a>`)
  .replace(/(?<!never )\b(PASS|FLAG|FAIL)(e?s)?\b/g, (m, o) => `<b class="o-${o}">${m}</b>`);
const depList = ids => ids.size ? `<ul class="deps">${[...ids].sort().map(i =>
  `<li><a class="rid" data-id="${i}">${esc(label(byId.get(i)))}</a> <span class="muted">${esc(byId.get(i).title)}</span></li>`).join("")}</ul>`
  : `<p class="muted">None</p>`;

function showPanel(n, up, down) {
  const statusChip = n.status === "needs approval" ? `<span class="chip needs">needs approval</span>`
    : n.status === "approved" ? `<span class="chip PASS">approved</span>` : `<span class="chip">rulebook text</span>`;
  document.getElementById("panel").innerHTML = `
    <h2>${esc(label(n))}</h2>
    <div class="muted">${esc(n.title || "")}</div>
    <div class="chips">
      <span class="chip" style="color:${COLORS[n.section]};border-color:${COLORS[n.section]}">${esc(SECTION_NAMES[n.section] || "")}</span>
      ${statusChip}
    </div>
    ${n.sub ? `<div class="muted" style="margin-top:8px">${esc(n.sub)}</div>` : ""}
    <h3>Outcomes</h3>
    <div class="chips">${n.triggers.length ? n.triggers.map(t => `<span class="chip ${t}">${t}</span>`).join("")
      : `<span class="muted">No outcome stated</span>`}</div>
    <h3>Rule text</h3>
    <div class="text">${n.text.split("\n").map(p => `<p>${rich(p)}</p>`).join("")}</div>
    ${n.notes.length ? `<h3>Notes for ${esc(n.sub.split(" ")[0])}</h3><div class="text">${n.notes.map(p => `<p>${rich(p)}</p>`).join("")}</div>` : ""}
    <h3>Upstream (${up.size}) — feeds this rule</h3>${depList(up)}
    <h3>Downstream (${down.size}) — depends on it</h3>${depList(down)}`;
}
document.getElementById("panel").addEventListener("click", e => {
  const a = e.target.closest("a.rid"); if (a) jump(a.dataset.id);
});

function jump(id) {
  const n = byId.get(id); if (!n) return;
  select(id);
  const {width, height} = svg.node().getBoundingClientRect();
  svg.transition().duration(500).call(zoom.transform, d3.zoomIdentity.translate(width / 2, height / 2).scale(1.4).translate(-n.x, -n.y));
}
const search = document.getElementById("search");
search.addEventListener("change", () => {
  const q = search.value.trim().toLowerCase();
  const n = nodes.find(n => n.id.toLowerCase() === q) || nodes.find(n => n.id.toLowerCase().startsWith(q) || label(n).toLowerCase().includes(q));
  if (n) { jump(n.id); search.value = n.id; }
});
</script>
</body>
